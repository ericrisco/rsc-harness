skill: write-swift

should_trigger:
  - prompt: "Why does this actor deadlock when I await inside it?"
    why: "Swift concurrency semantics at the language level: the skill's core subject."
  - prompt: "I'm getting data-race errors after turning on Swift 6 strict concurrency. How do I fix them properly?"
    why: "Swift 6 data-race safety and the approachable-concurrency model, named in the description."
  - prompt: "Should this be `some Protocol` or `any Protocol`?"
    why: "Existentials versus generics, an explicit section with a stated default."
  - prompt: "Rewrite this class as a value type and tell me when a struct is the wrong choice."
    why: "The value-types-first hierarchy of defaults this skill is built around."
  - prompt: "Migrate these XCTest cases to Swift Testing."
    why: "Swift Testing is explicitly in scope."
  - prompt: "This Swift code has a retain cycle and I can't find it."
    why: "ARC and retain cycles, named in the description."

should_not_trigger:
  - prompt: "Build this settings screen in SwiftUI with NavigationStack and SwiftData persistence."
    route_to: "swift-ios"
    why: "Platform work — views, navigation, persistence — belongs to the platform skill."
  - prompt: "Ship this iOS app to TestFlight and set up the App Store listing."
    route_to: "swift-ios"
    why: "Shipping and store concerns, not the language."
  - prompt: "Make this iOS sheet feel fluid when you flick it, with the right spring."
    route_to: "apple-design"
    why: "Interface feel and gesture physics, not language semantics."
  - prompt: "Fix the data race in this Kotlin coroutine."
    route_to: "kotlin-android"
    why: "Same class of problem, different language."
  - prompt: "Write the TypeScript types for this API client."
    route_to: "typescript"
    why: "A different language entirely."

capability:
  - scenario: "A project on Swift 5.9 asks for advice about `@concurrent` and main-actor-by-default."
    expect: "Checks the toolchain baseline before applying the rules: the Swift 6.2 concurrency guidance does not apply to a 6.1-or-earlier project, and the answer says so rather than recommending syntax that will not compile. Unreleased features stay marked as unreleased."
