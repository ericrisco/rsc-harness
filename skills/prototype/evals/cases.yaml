skill: prototype

should_trigger:
  - prompt: "Build me three different versions of this pricing card so I can pick one."
    why: "Several genuinely different versions behind a picker: the skill's core use case."
  - prompt: "I don't know what I want this empty state to look like — show me some options I can click through."
    why: "Divergent exploration with a live picker, which is what this skill builds."
  - prompt: "Give me a few takes on the toast component and let me flip between them."
    why: "'Flip between them' is the picker; a toast is a single, well-scoped piece."
  - prompt: "Prototype four directions for the dashboard header, from quiet to bold."
    why: "Named axis (restraint to boldness) with a variant count inside the cap."
  - prompt: "Explore some designs for the hold-to-delete button before we commit to one."
    why: "Exploration before commitment; production code stays untouched until a winner is picked."

should_not_trigger:
  - prompt: "Animate the toast we already chose, with the right curve and duration."
    route_to: "animate"
    why: "A single chosen target; there is nothing to diverge on."
  - prompt: "Review the motion in the variant I picked."
    route_to: "review-animations"
    why: "Judging one implementation, not generating alternatives."
  - prompt: "Design the whole marketing site — hero, pricing, footer, the works."
    route_to: "design"
    why: "A whole-page visual system, far past the one-piece-per-run scope."
  - prompt: "Which drag-and-drop library should we install for this?"
    route_to: "pick-ui-library"
    why: "A dependency decision; this skill does not install libraries to explore a layout."

capability:
  - scenario: "User asks for three versions of a card in a project with existing Tailwind tokens and a crisp, dense dashboard personality."
    expect: "States each variant's axis before building, and no two variants share an axis position — three tints of the same idea is the failure mode. Every variant uses the project's tokens, works for real with plausible content, and meets the motion bar individually. Presents the tradeoffs honestly and stops: the choice is the user's."
