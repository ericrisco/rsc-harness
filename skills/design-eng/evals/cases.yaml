skill: design-eng

should_trigger:
  - prompt: "Our frontend needs work but I'm not sure what — the design, the animations, something feels off. Where do I start?"
    why: "Ambiguous frontend craft request that could belong to several siblings; routing is exactly this skill's job."
  - prompt: "I want to improve the design engineering of this UI — the polish, the details that make it feel considered."
    why: "'Design engineering' and 'polish' name the umbrella's own subject; it carries the philosophy and routes the specific work."
  - prompt: "Which of your skills should I use for the interface craft on this React app?"
    why: "Explicitly asking which sibling owns the work — the routing table is the answer."
  - prompt: "Why does our app feel cheap compared to Linear or Raycast, even though everything works?"
    why: "The 'works but doesn't feel right' diagnosis is the umbrella's core philosophy; it then routes to the sibling that fixes the specific cause."
  - prompt: "Teach me the taste side of frontend — the unseen details that compound into software people love."
    why: "Taste, unseen details and beauty-as-leverage are the philosophy this body carries rather than delegating."
  - prompt: "Review this UI code for craft, and use the before/after table format."
    why: "The required Before/After/Why review format lives in this body specifically."

should_not_trigger:
  - prompt: "Animate this dropdown so it opens smoothly with the right easing and duration."
    route_to: "animate"
    why: "A concrete build request with a named component; the umbrella routes it rather than doing it."
  - prompt: "Pick a color palette and type pairing for the product and give me the Tailwind tokens."
    route_to: "design"
    why: "Visual system and brand grounding belong to design; this skill owns craft and motion, not the palette."
  - prompt: "Set up the Next.js App Router with server actions for these pages."
    route_to: "nextjs"
    why: "App Router build mechanics; no craft or routing decision involved."
  - prompt: "Audit every animation across our whole codebase and give me a prioritized roadmap."
    route_to: "improve-animations"
    why: "Unambiguous object (the whole codebase) with an unambiguous deliverable (plans); no routing needed."
  - prompt: "Design the Postgres schema and indexes for our multi-tenant billing tables."
    route_to: "none"
    why: "No UI surface at all — the umbrella declines rather than finding something design-shaped to say."

capability:
  - scenario: "User says: 'the frontend feels off, fix it' in a Vue repo where design-eng was auto-installed by repo detection."
    expect: "Names the sibling it is routing to and why, states what it passed over, and does not start doing the sibling's work in the umbrella. If the request is a new feature rather than a fix, it names the SDD gate first."
