skill: design

should_trigger:
  - prompt: "Design a landing page for our new analytics SaaS."
    why: "A public page to design from scratch is the page run's core case (Persuade mode)."
  - prompt: "Our homepage looks generic, like every other AI-generated startup site. Make it look designed."
    why: "'Looks generic / AI-made' is named in the description; the skill exists to replace the model's default."
  - prompt: "Hazme la web de un restaurante de mi pueblo, que no parezca una plantilla."
    why: "A local business page in Spanish; the inventory of the subject and real pictures are exactly what the run forces."
  - prompt: "Rediseña el dashboard de facturación, que se ve feo y desordenado."
    why: "An app screen redesign (Operate mode) follows the app-screen run with its own draw and inspector."
  - prompt: "Review this portfolio page and tell me the three changes that would improve it most."
    why: "A review of an existing page: record the before in the browser, critique the screenshots, stop at findings."
  - prompt: "Restyle our docs site so it stops looking like every other docs template."
    why: "Read mode: the style owns the frame while the reading column stays calm."

should_not_trigger:
  - prompt: "Write the hero headline, offer and CTA copy for our pricing page."
    route_to: "landing-copy"
    why: "The words on a conversion page belong to landing-copy; design builds the page around them."
  - prompt: "Where should the filter state live, in the URL or in the component, and how do we handle loading and errors?"
    route_to: "ui-engineering"
    why: "How interface is built (state, boundaries, async states) is ui-engineering, not visual design."
  - prompt: "Make our web app pass WCAG 2.2 AA: fix the axe violations and keyboard traps."
    route_to: "accessibility"
    why: "Conformance remediation is the accessibility skill's job."
  - prompt: "Create our logo brief and a full brand book with print colours."
    route_to: "brand-identity"
    why: "A brand system for every medium is brand-identity; design consumes it with --keep palette,type."
  - prompt: "Set up Next.js App Router routing and server actions for these pages."
    route_to: "nextjs"
    why: "Framework build mechanics are nextjs."

capability:
  - scenario: "Asked to build a landing page for a bakery with no brand and no photographs."
    must_include:
      - "inventory of eight to twelve things only this client has"
      - "draw.mjs deals three directions; one is chosen against the inventory with a written reason"
      - "an idea sentence that fails the competitor test, and one live thing"
      - "at least four real pictures found with assets.mjs and credited"
      - "inspect.mjs at 1440, 768 and 390 with zero FAIL before reporting"
  - scenario: "The machine has no Chrome and Node 20."
    must_include:
      - "runs lint.mjs and critiques screenshots from another browser tool"
      - "the report says 'inspector not run' with the reason and claims no gate pass"
