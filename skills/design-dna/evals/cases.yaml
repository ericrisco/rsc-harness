skill: design-dna

should_trigger:
  - prompt: "This landing page came out beautiful. Turn it into a skill so I can reuse the look."
    why: "The canonical CAPTURE case: a winner exists and the ask is to make its identity permanent and reusable."
  - prompt: "Make five more carousels like this one, same look."
    why: "'More like this' with an existing reference is REUSE if a record exists and CAPTURE if it does not; either way this skill owns the decision."
  - prompt: "Keep the same style as the deck you built me last week."
    why: "Style continuity across pieces is the problem this skill exists for; without a written record the model reproduces the average instead."
  - prompt: "Everything I generate now looks like generic AI slop. It didn't at the start."
    why: "Named verbatim in the description as a trigger. Drift is the symptom of unwritten rules, and the fix is a record with bans, not another prompt."
  - prompt: "Lock this look in so it stops changing on me."
    why: "Explicit trigger phrase; the ask is permanence, which is the record plus tests that can fail."
  - prompt: "Every carousel I post looks slightly different from the last one. I want them to read as a set."
    why: "Non-obvious: no keyword overlap with 'skill' or 'style'. The stated symptom is missing named archetypes — inconsistent structure under consistent styling."
  - prompt: "Esto ha salido bien. Quiero que las siguientes cinco se vean igual."
    why: "Non-English, no keyword overlap; the semantic shape is a winner plus a demand for reproducible identity."

should_not_trigger:
  - prompt: "Design a landing page for my new analytics SaaS — hero, pricing, the works."
    route_to: "design"
    why: "No winner and no reference to measure. Capturing an average of candidates produces the average, which is the thing the method exists to escape."
  - prompt: "Make our homepage as good as linear.app and don't stop until it wins."
    route_to: "design-loop"
    why: "Finding the winner is the upstream half of the pipe. There is nothing to codify until a piece has cleared the bar."
  - prompt: "Write the hero headline and value prop for this page."
    route_to: "marketing"
    why: "The words. `voice` in the record constrains copy; it does not write it."
  - prompt: "Build these pages with the App Router and server actions."
    route_to: "nextjs"
    why: "The build. The identity stays in the record; the framework work is the sibling's."
  - prompt: "Give me three different directions for this poster and I'll choose."
    route_to: "prototype"
    why: "Exploration among variants. One skill per style: merging two candidate identities into one spec produces the average of two good designs, which is a bad design."

capability:
  - scenario: "User attaches a screenshot of a landing page they love and says 'codify this'. (CAPTURE mode, nothing captured for this style yet.)"
    must_include:
      - "Runs the seven steps in order and shows work at each; does not jump straight to writing a style file."
      - "Step 1 produces literal measurements with NO judgements — sampled colours, coverage estimates, type counts, largest-to-smallest ratio, margins as percentages, and what is ABSENT."
      - "Records ratios and relationships rather than absolute values ('headline is 8x body, never under 6x', not 'headline is 96px')."
      - "Records colour COVERAGE percentages, not just the colours — states that the same three colours at 60/30/10 and at 90/8/2 are two unrelated designs."
      - "Uses descriptive colour names ('dusty plum'), never systematic ones ('accent-500'), because image and video models cannot read token names."
      - "Gives every type family a fallback."
      - "Identifies the ONE deliberate break in the system (the weird move) and gives it its own field."
      - "Writes 8-12 tests that are binary and measurable, marks which are automatable, and rejects 'feels premium' / 'looks clean' as non-tests."
      - "Produces MORE bans than positive style rules, written as absolutes."
      - "Does NOT skip Step 5: rebuilds the reference from the record alone, diffs against the original, folds every difference back in as a forgotten field, and records the gaps found."
      - "Keeps the record and the payload as two separate artefacts: the payload is capped at 2KB and the record never enters a prompt."
      - "Puts any real logo, wordmark, licensed photograph or proprietary typeface into not_copied with a named substitute — reproduces the system, never the marks."
      - "Declares every inferred-rather-than-measured value and every rule under 70% confidence."
      - "Validates the emitted skill with the emit script rather than asserting it works."
  - scenario: "A style called `cold-press` already has a full record. User says: 'build me an about page in cold-press'."
    must_include:
      - "Recognises this as REUSE and does NOT re-derive the style — a style with a record is never re-measured."
      - "Loads that style's payload ONLY and attaches the kept reference; does not read the full record into context."
      - "Picks a named archetype BEFORE writing anything, so the new piece sits beside the earlier ones as a set."
      - "Hands the build to the nextjs sibling and the words to marketing, keeping the identity here."
      - "Runs the style's own auto-check before returning, names each test and its result, and repairs then re-runs on any failure."
      - "Does not return output with a failing test plus a note explaining it away."
  - scenario: "A style is captured and its record is complete, but the pages built from it still come out looking generic. User asks what to add."
    must_include:
      - "Adds a BAN, not another positive rule — states that a positive instruction is one weak vote against the average while a prohibition deletes a whole space."
      - "Checks whether the signature moves are missing or too numerous and cuts to 3-9, each rewritten as a ratio."
      - "Checks whether the payload is over its cap, since an over-cap payload is obeyed unevenly and differently each run."
      - "Checks whether the strongest rule is buried in the middle of the payload rather than at either end."
      - "Checks whether a weird move exists at all, since a spec with no break in the system reads as forgettable rather than wrong."
      - "Does not respond by merging in a second style or by re-capturing from scratch."
