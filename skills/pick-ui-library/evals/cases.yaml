skill: pick-ui-library

should_trigger:
  - prompt: "What should I use for toasts in this React app?"
    why: "A task-to-library lookup, the skill's core use case."
  - prompt: "Which library for drag and drop? I don't want to hand-roll it."
    why: "Named task with a curated answer; hand-rolling is the mismatch the skill catches."
  - prompt: "I need a command palette like Raycast's — what do I install?"
    why: "Command menus are an explicit row in the list."
  - prompt: "This list has 5000 rows and it's crawling. What do people use for virtualization?"
    why: "Virtualization is an explicit row, and the 1000+ row case is a named mismatch."
  - prompt: "We need a one-time-password input for the verification screen."
    why: "OTP inputs are an explicit row."
  - prompt: "What's the right pick for charts in a dashboard, and does live data change the answer?"
    why: "Charts, with the streaming-versus-static split the list makes explicit."

should_not_trigger:
  - prompt: "Animate the toast so it slides in and can be swiped away."
    route_to: "animate"
    why: "Motion on an already-chosen component."
  - prompt: "Fix the toasts — they appear twice and lose their Tailwind classes."
    route_to: "ask-sonner"
    why: "Sonner-specific troubleshooting has its own guide."
  - prompt: "Restructure where state lives across these React components and fix the re-render storm."
    route_to: "react"
    why: "App architecture, not a dependency choice."
  - prompt: "Which Postgres extension should we use for vector search?"
    route_to: "vector-db"
    why: "Also a 'which library' question, but a data-layer one outside this list."

capability:
  - scenario: "The project's package.json already uses react-window, and the user asks what to use for virtualizing a large table."
    expect: "Reads package.json first, names the curated pick, and flags that a competitor is already installed without churning the dependency unasked. If the task were genuinely outside the curated list, it says so explicitly instead of pretending the list covers it."
