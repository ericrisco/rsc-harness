skill: find-animation-opportunities

should_trigger:
  - prompt: "What could be animated in this app that isn't animated today?"
    why: "The skill's core question, verbatim in the description."
  - prompt: "Make this feel more alive — but tell me where, don't just add motion everywhere."
    why: "'Make this feel more alive' plus the restraint constraint the skill is built around."
  - prompt: "Find the places in our UI where a transition would actually help."
    why: "A search for genuine opportunities, filtered by the four-question gate."
  - prompt: "Where would motion help this onboarding flow, and where would it get in the way?"
    why: "Both halves — the finder and the filter — which is why the rejected-candidates section exists."
  - prompt: "Our interface feels static and dead. What should move?"
    why: "The symptom that leads to this skill, with the answer bounded by the frequency gate."

should_not_trigger:
  - prompt: "Animate the modal I just built, with the right easing and duration."
    route_to: "animate"
    why: "The target is chosen; this is implementation."
  - prompt: "Review the animations already in this diff."
    route_to: "review-animations"
    why: "Judging existing motion, not finding absent motion."
  - prompt: "Audit the whole codebase's motion and write plans for the fixes."
    route_to: "improve-animations"
    why: "Existing motion at codebase scale, with plans as the deliverable."
  - prompt: "Build the animation you suggested for the toast."
    route_to: "animate"
    why: "This skill is read-only; it hands implementation off explicitly."

capability:
  - scenario: "A dense internal ops dashboard used all day by support agents, with a command palette and data tables."
    expect: "Returns few or no suggestions and says so as a good result. Rejects the command palette explicitly (keyboard-initiated, 100+/day) and the data visualizations (functional data the user is reading), and the report includes the required rejected-candidates section with the gate question that killed each."
