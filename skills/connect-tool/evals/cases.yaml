skill: connect-tool

# Cases for connect-tool: the user names ONE tool to connect to the agent. The skill researches the
# vendor's real docs FIRST, picks the least dangerous route (MCP, API, integration, vendor module,
# file exchange, read-only copy of the database; never RPA or scraping), builds 01-TOOLS/<TOOL>/ with
# a test that proves it (and proves writes fail when read-only), guides the user and records it in
# 02-DOCS. Only when nothing is documented does it take option 2: diagnose the program in
# conversation, find who holds the key, and keep going. It is NOT the typed API client
# (api-connector-builder), NOT the whole-workspace scan (harness), NOT whether to automate a process
# (automation-strategy), NOT chaining services (automation-flows).

should_trigger:
  - prompt: "Quiero que el agente lea las facturas de Holded para hacerme un resumen de cobros cada lunes."
    why: "A named cloud tool and a read goal. The route (official API with read scopes, or an MCP if the vendor has one) must come from Holded's current docs, then a 01-TOOLS/HOLDED/ folder with a read test."

  - prompt: "Tenemos Sage 50 instalado en el ordenador de la oficina. ¿Puede el agente leer los clientes?"
    why: "Desktop software with no public API: the legacy pattern, find where the data lives, read a nightly copy with a SELECT-only login, never the live database, and ask the distributor first."

  - prompt: "Hook up our WhatsApp Business number so the agent can see incoming orders."
    why: "A named tool where the route is not obvious (the Business app versus the Cloud API). Research decides, and reading orders is the first, read-only step."

  - prompt: "Mi TPV no tiene API. ¿Cómo hago que el agente vea las ventas?"
    why: "Non-obvious trigger: no API is not the end. The route comes from the product's export features or a read-only copy of its database, found in the vendor's docs."

  - prompt: "Connect the agent to our Access database, the one the old stock program uses."
    why: "A legacy file database. Copy the .mdb/.accdb, read it with mdbtools or convert it, and never write into the program's file."

  - prompt: "¿Se puede conectar InstalWin? No sé ni por dónde empezar."
    why: "An obscure vertical program nobody has catalogued: the method (search vendor docs, export features, the database it installs) works for it, and if nothing reliable exists the skill says so and goes to option 2."

  - prompt: "Quiero que el agente meta los asientos de las facturas de proveedores en nuestro Sage 50."
    why: "Writing into an installed accounting program: the route is the official import file the user's program exports as a sample, validated and imported by a person into the test company first, never the database."

should_not_trigger:
  - prompt: "Write a TypeScript client for the Holded API with pagination, retries and token refresh."
    route_to: "api-connector-builder"
    why: "The route is already decided; what remains is building a robust typed client, which is that skill's job."

  - prompt: "Set up 01-TOOLS and 02-DOCS for this whole repo and detect every provider we use."
    route_to: "harness"
    why: "A whole-workspace scan and layout, not one named tool."

  - prompt: "¿Merece la pena automatizar la conciliación bancaria o la seguimos haciendo a mano?"
    route_to: "automation-strategy"
    why: "Whether to automate a process at all; no tool is being connected yet."

  - prompt: "When a Stripe payment lands, create the invoice in Holded and post it to Slack."
    route_to: "automation-flows"
    why: "Chaining already-connected services into a workflow, not establishing one connection."

  - prompt: "We need to receive Stripe webhooks and verify their signatures."
    route_to: "webhooks"
    why: "Inbound callbacks into our own service, not connecting the agent to an outside tool."

capability:
  - scenario: "A non-technical user says: 'Usamos A3 en un servidor de la oficina, lo lleva una gestoría. Quiero que el agente me diga qué clientes deben dinero.' Show what the agent does from the first answer to the end."
    must_include:
      - "Asks only what the docs cannot answer (edition, where it runs, who administers it) and confirms the goal is reading, not writing"
      - "Researches the vendor's current documentation and cites sources with dates, or says plainly that nothing reliable was found"
      - "Chooses a read-only route and never proposes writing into the program's database; if writing comes up, it goes through the official import format"
      - "Proposes reading a nightly copy with a SELECT-only user, reached privately, never the live database exposed to the internet"
      - "Builds 01-TOOLS/<TOOL>/ from the template with a test_connection that proves reading works AND that a write is refused, telling a permission error apart from any other failure"
      - "Explains the chosen route in plain words and records the connection in 02-DOCS"

  - scenario: "A small-business owner says: 'Quiero conectar Geyce, nuestro programa de gestión de hace veinte años. No sé qué tipo de programa es ni a quién preguntar.' Research finds no public API, MCP or technical documentation. Show what the agent does."
    must_include:
      - "Researches first (vendor docs, MCP registry, exports and imports in the manual) and cites what it searched and the date, saying plainly that nothing reliable was found"
      - "Only then takes option 2 and does not stop: asks the plain diagnosis questions (website login, works offline, several PCs share data, remote desktop, data-folder extensions, who they call when it breaks)"
      - "Says which program type it looks like and how sure it is, what can be tried, and what the user must confirm"
      - "Finds out who holds the key (distributor, IT person or accounting firm) and lists the closed questions for them: database engine, read-only user on a copy, scheduled export to a folder, whether the contract allows reading the database, cost"
      - "Leaves the case open in 02-DOCS with what was asked, to whom and when, so another session can pick it up"
      - "Never proposes screen automation (RPA) or scraping"

  - scenario: "The user answers the diagnosis: 'Entramos al programa por un escritorio remoto que nos da el distribuidor; en la oficina no hay nada instalado.' Show what the agent concludes and proposes."
    must_include:
      - "Recognises a program hosted by the distributor: there is no database to copy and no folder the agent can reach"
      - "States that the only door is the provider and does not try to reach their servers any other way"
      - "Proposes asking the distributor for a scheduled export to a folder the client can reach, an integration module or API, or a read-only user on their side, with the cost question"
      - "Offers the message for the distributor from the messages section, read-only and with nothing opened to the internet"
      - "If the provider offers nothing, says the honest options are to keep asking the vendor or to weigh migrating, not RPA"

  - scenario: "The user says: 'Llevamos la contabilidad en ContaSOL instalado. Quiero que el agente registre los asientos de las facturas de compra que llegan al correo.' Show the route from the first answer to the first import."
    must_include:
      - "Chooses file exchange for writing: the agent generates ContaSOL's official import file in 01-TOOLS/<TOOL>/out/ and a person reviews and imports it; never writes into the program's database"
      - "Asks for a sample file exported from the user's own ContaSOL and copies its structure, instead of a remembered format"
      - "Describes the format (columns, encoding, separator, decimal mark, dates) in the tool's README"
      - "Validates before releasing the file: entries balance, accounts exist in the current chart, no duplicates against a batch log"
      - "Makes the first import into the program's test company, not the real books"

  - scenario: "The user says: 'Mi ERP no tiene API. ¿Podemos poner un robot que haga clic en las pantallas, o que el agente lea la web del programa?'"
    must_include:
      - "Declines screen automation (RPA) and scraping: they act with a person's permissions, break on every update and cannot prove they only read"
      - "Researches the other routes first: vendor or distributor module, cloud edition with an API, scheduled export, official import file, read-only copy of the database"
      - "If one exists, proposes it; if none exists, says so and offers asking the vendor or weighing migration with the connect-or-migrate signals"

