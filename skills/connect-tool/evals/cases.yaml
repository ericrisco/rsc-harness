skill: connect-tool

# Cases for connect-tool: the user names ONE tool to connect to the agent. The skill researches the
# vendor's real docs, picks the least dangerous route (MCP, API, integration, export, read-only copy
# of the database, RPA last), builds 01-TOOLS/<TOOL>/ with a test that proves it (and proves writes
# fail when read-only), guides the user and records it in 02-DOCS. It is NOT the typed API client
# (api-connector-builder), NOT the whole-workspace scan (harness), NOT whether to automate a process
# (automation-strategy), NOT chaining services (automation-flows).

should_trigger:
  - prompt: "Quiero que el agente lea las facturas de Holded para hacerme un resumen de cobros cada lunes."
    why: "A named cloud tool and a read goal. The route (official API with read scopes, or an MCP if the vendor has one) must come from Holded's current docs, then a 01-TOOLS/HOLDED/ folder with a read test."

  - prompt: "Tenemos Sage 50 instalado en el ordenador de la oficina. ¿Puede el agente leer los clientes?"
    why: "Desktop software with no public API: the legacy pattern, find where the data lives, read a nightly copy with a SELECT-only login, never the live database, and ask the distributor first."

  - prompt: "Hook up our WhatsApp Business number so the agent can see incoming orders."
    why: "A named tool where the route is not obvious (the Business app versus the Cloud API). Research decides, and reading orders is the first, read-only step."

  - prompt: "Mi TPV no tiene API. ¿Qué le pido al informático para que el agente vea las ventas?"
    why: "Non-obvious trigger: no connection yet, the deliverable is the route choice plus the ready-to-send message for the IT person asking for an export or a read-only user."

  - prompt: "Connect the agent to our Access database, the one the old stock program uses."
    why: "A legacy file database. Copy the .mdb/.accdb, read it with mdbtools or convert it, and never write into the program's file."

  - prompt: "¿Se puede conectar InstalWin? No sé ni por dónde empezar."
    why: "An obscure vertical program nobody has catalogued: the method (search vendor docs, export features, the database it installs) works for it, and if nothing reliable exists the skill says so."

should_not_trigger:
  - prompt: "Write a TypeScript client for the Holded API with pagination, retries and token refresh."
    route_to: "api-connector-builder"
    why: "The route is already decided; what remains is building a robust typed client, which is that skill's job."

  - prompt: "Set up 01-TOOLS and 02-DOCS for this whole repo and detect every provider we use."
    route_to: "harness"
    why: "A whole-workspace scan and layout, not one named tool."

  - prompt: "¿Merece la pena automatizar la conciliación bancaria o la seguimos haciendo a mano?"
    route_to: "automation-strategy"
    why: "Whether to automate a process at all; no tool is being connected yet."

  - prompt: "When a Stripe payment lands, create the invoice in Holded and post it to Slack."
    route_to: "automation-flows"
    why: "Chaining already-connected services into a workflow, not establishing one connection."

  - prompt: "We need to receive Stripe webhooks and verify their signatures."
    route_to: "webhooks"
    why: "Inbound callbacks into our own service, not connecting the agent to an outside tool."

capability:
  - scenario: "A non-technical user says: 'Usamos A3 en un servidor de la oficina, lo lleva una gestoría. Quiero que el agente me diga qué clientes deben dinero.' Show what the agent does from the first answer to the end."
    must_include:
      - "Asks only what the docs cannot answer (edition, where it runs, who administers it) and confirms the goal is reading, not writing"
      - "Researches the vendor's current documentation and cites sources with dates, or says plainly that nothing reliable was found"
      - "Chooses a read-only route and never proposes writing into the program's database; if writing comes up, it goes through the official import format"
      - "Proposes reading a nightly copy with a SELECT-only user, reached privately, never the live database exposed to the internet"
      - "Builds 01-TOOLS/<TOOL>/ from the template with a test_connection that proves reading works AND that a write is refused, telling a permission error apart from any other failure"
      - "Writes the ready-to-send message for the accounting firm asking for a read-only user or an export, and records the connection in 02-DOCS"
