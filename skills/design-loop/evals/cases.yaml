skill: design-loop

should_trigger:
  - prompt: "Build me a landing page for our analytics product that's as good as linear.app — here's the URL."
    why: "Goal plus a named, openable reference to beat. This is the skill's core shape: a bar exists and the work must clear it."
  - prompt: "Our homepage looks generic. Loop it against stripe.com until it actually wins."
    why: "'Looks generic' plus a named bar plus explicit looping — three of the skill's stated triggers in one sentence."
  - prompt: "/design-loop"
    why: "Explicit invocation by name; the skill must run its own interview rather than asking what the user wants in free form."
  - prompt: "I want a pitch deck that holds up next to this one — attaching their PDF."
    why: "Non-obvious because the medium is not web. The method is medium-agnostic: a deck with an openable reference is the same loop, and the craft critic renders to PDF instead of screenshots."
  - prompt: "Run the critic loop on the pricing page and don't stop until it beats the reference."
    why: "Names the mechanism (critic loop) and the exit condition (beating the reference) rather than the outcome."
  - prompt: "Quiero que esta página le gane a la de vercel. Dale vueltas hasta que gane."
    why: "Non-English phrasing with no keyword overlap with the description; the trigger is the semantic shape — a reference to beat plus iteration until it wins."
  - prompt: "This animation feels cheap compared to the one on their site. Can you get it to that level?"
    why: "Non-obvious: reads like a motion request, but a named reference plus a quality gap is a bar to converge against. The loop owns convergence and hands the motion implementation to the craft siblings."

should_not_trigger:
  - prompt: "This page came out great. Codify it into a reusable style so my next five pages match it."
    route_to: "design-dna"
    why: "The winner already exists; nothing left to converge. Capturing an identity is the downstream half of the pipe, not the loop."
  - prompt: "Pick a colour palette and type pairing for my product and give me the Tailwind tokens."
    route_to: "design"
    why: "Visual system work with no reference to beat and nothing to judge. `design` stays directly reachable exactly for this."
  - prompt: "Show me three versions of this button and I'll pick the one I like."
    route_to: "variant-explorer"
    why: "Selection among variants by human preference, not convergence against a measured bar. The user is the judge and there is no reference."
  - prompt: "Review the motion in this diff and tell me what's off."
    route_to: "motion-craft"
    why: "One diff, motion-specific, no reference and no build-then-judge rounds. The motion craft skill owns the complaint-to-cause mapping; reviewing is not looping."
  - prompt: "Write the hero headline and value prop for our developer-tool site."
    route_to: "marketing"
    why: "The words, not the bar. `voice` constrains copy in this pipe; it does not write it."
  - prompt: "Set up the Next.js App Router routing and server actions for these pages."
    route_to: "nextjs"
    why: "Pure build mechanics with no design judgement involved at all."

capability:
  - scenario: "User asks: 'Make our homepage as good as Apple's website.' (Vague bar. The repo has a design system at design-system.md but no way to render output to screenshots.)"
    must_include:
      - "Pushes back ONCE for the specific page or file rather than accepting 'Apple's website' — names that a vague bar is the top failure mode because a critic with no concrete reference invents the comparison and approves everything on round one."
      - "Runs preflight BEFORE any work and reports it as one block: fetches the bar, checks render capability, checks input files."
      - "Explicitly names that the CRAFT critic goes blind because output cannot be rendered — does not quietly proceed with three critics when only two can see."
      - "Does not start building during the interview, preflight or teardown phases."
      - "Writes 5-7 mechanisms to bar.md as checkable measurements (ratios, coverage, percentages, absences) and shows them to the user before continuing; rejects adjectives like 'feels premium' as mechanisms."
      - "Uses binary verdicts, never numeric scores, and states that scores drift upward every round."
      - "Keeps critics on rendered output only, never the implementation, and gives each fresh context with no knowledge of how the builder worked."
  - scenario: "The loop is running on a hero section. Round 2's craft critic names 'not enough breathing room above the fold' as the biggest gap. Round 3's craft critic names 'the hero feels empty, needs more density' as the biggest gap. Round 4 would name 'not enough breathing room' again."
    must_include:
      - "HALTS that piece instead of starting another round — detects that the same biggest gap has been named twice for the same piece."
      - "Puts the two competing demands side by side (more air vs more density) and asks the user to decide, rather than picking one itself or averaging them."
      - "Does not present the halt as a failure of the loop; it is the declared exit for non-convergence."
      - "Shows round count and pieces rather than claiming a token cost, and states that no reliable self-reported token cost exists."
      - "Keeps the gap history that made the detection possible, as part of the live progress page."
  - scenario: "A piece has cleared all three critics and the user says 'perfect, now do the other four pages'."
    must_include:
      - "Hands the winner to design-dna to codify it into a permanent identity before building the remaining pieces, rather than re-running the loop from scratch four more times."
      - "Names why: winning once without writing down the mechanisms is how the look drifts back to generic by the fifth piece."
      - "Does not merge the won style with any other identity."
