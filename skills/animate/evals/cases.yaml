skill: animate

should_trigger:
  - prompt: "Animate this dropdown so it opens smoothly — pick the right easing and duration."
    why: "A build request for a named component's motion: the skill's core use case."
  - prompt: "Add a transition when the modal opens and closes so it doesn't just pop in."
    why: "Building an enter/exit animation, including the exit path the skill insists is symmetric."
  - prompt: "Make this button feel responsive when you press it."
    why: "Press feedback is a recipe in this skill; 'feel responsive' is its vocabulary."
  - prompt: "I want a hold-to-delete button where the fill animates while you hold it."
    why: "Hold-to-confirm is an explicit recipe (clip-path, 2s linear press, snappy release)."
  - prompt: "Add motion to this toast so it slides in from the bottom and can be swiped away."
    why: "Toast motion with a gesture: transitions over keyframes, symmetric exit, velocity dismissal."
  - prompt: "Make this list of cards feel alive when the page loads."
    why: "'Feel alive' is named in the description; the answer is a stagger, or a refusal if the frequency tier is wrong."

should_not_trigger:
  - prompt: "Review the animations in this pull request and tell me what's wrong with them."
    route_to: "review-animations"
    why: "Critiquing existing motion, not building it."
  - prompt: "Animate this bottom sheet in our Expo app so the drag feels native on Android."
    route_to: "animate-expo"
    why: "React Native / Expo motion: different runtime, different tools, no hover."
  - prompt: "What could be animated in this dashboard? I don't know where motion would help."
    route_to: "find-animation-opportunities"
    why: "Nothing has been chosen yet; this is a search, not a build."
  - prompt: "What's the term for when a popover grows out of the button you clicked?"
    route_to: "animation-vocabulary"
    why: "A naming question, not an implementation."
  - prompt: "Choose the color palette and spacing scale for this landing page."
    route_to: "design"
    why: "Visual system, no motion involved."

capability:
  - scenario: "User asks: 'animate the command palette so it fades in when you hit Cmd+K'."
    expect: "Refuses the animation on frequency grounds — a keyboard-initiated, 100+/day action gets no motion — says so plainly, and offers the instant state change instead. Producing zero lines of animation code here is the correct outcome."
