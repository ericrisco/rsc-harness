skill: unity
should_trigger:
  - prompt: "My Unity player character teleports and jitters through walls when I move it with the arrow keys. Here's my MonoBehaviour."
    why: "Physics-in-Update / setting transform on a Rigidbody — core lifecycle + FixedUpdate guidance this skill owns."
  - prompt: "What's the difference between Awake and Start in Unity, and where should I grab my other components?"
    why: "Directly the MonoBehaviour lifecycle section (Awake caches, Start does cross-object wiring)."
  - prompt: "Help me convert my old Input.GetAxis(\"Horizontal\") movement to Unity's new Input System with an action map."
    why: "Legacy→new Input System migration; ban-list + §6/input-system reference."
  - prompt: "I want to store all my enemy stats (health, speed, damage) as data assets I can tweak in the Inspector. Best way in Unity?"
    why: "ScriptableObject for data/config + [SerializeField] vs public + serialization rules."
  - prompt: "How do I load a second Unity scene on top of the current one for my UI without unloading the level?"
    why: "Scenes & additive loading (LoadSceneAsync + LoadSceneMode.Additive)."
  - prompt: "Should I use a coroutine, async Task, or Awaitable for a 'wait 2 seconds then spawn' timer in Unity 6?"
    why: "Coroutines vs async/await vs Awaitable decision — §7, including destroyCancellationToken."
  - prompt: "Setting up multiplayer in Unity — I found UNet / UnityEngine.Networking tutorials, do they still work?"
    why: "Version contract: UNet removed → Netcode for GameObjects; routes the wire itself onward but Unity owns the 'it's removed' fact."
should_not_trigger:
  - prompt: "How do I write a NavMeshAgent that chases the player and avoids obstacles smoothly?"
    route_to: "gamedev-pathing"
    why: "Pathfinding/steering algorithms are the pathing skill; Unity only owns the component wiring."
  - prompt: "Design a Shader Graph for a dissolving-enemy effect with an emissive edge in URP."
    route_to: "gamedev-shaders"
    why: "Shader/material authoring belongs to the shaders skill."
  - prompt: "I'm making a game in Godot 4 with GDScript and my _ready() isn't firing."
    route_to: "godot"
    why: "Godot/GDScript engine — explicitly out of scope; route to godot."
  - prompt: "In Unreal Engine 5 my Blueprint Actor won't replicate movement to clients."
    route_to: "unreal"
    why: "Unreal/Blueprint engine work — route to unreal."
  - prompt: "Write the authoritative server tick and client-side prediction/reconciliation for our netcode."
    route_to: "gamedev-multiplayer"
    why: "Netcode protocol/authority design is the multiplayer skill; Unity stops at 'use Netcode for GameObjects'."
capability:
  - scenario: "User asks how to move a Rigidbody with input from the new Input System without jitter, in Unity 6."
    must_include:
      - "reads input in Update (caches intent) but applies movement in FixedUpdate"
      - "uses Rigidbody.MovePosition (or AddForce), not setting transform.position on the body"
      - "uses the new Input System (InputAction / action map / ReadValue<Vector2>), not Input.GetAxis"
  - scenario: "User asks whether to use a coroutine or async for a delayed spawn and how to make it stop when the object is destroyed."
    must_include:
      - "recommends Awaitable (or coroutine) over raw Task for Unity gameplay in Unity 6"
      - "passes destroyCancellationToken to the Awaitable so it cancels on destroy"
      - "warns never to await the same Awaitable instance twice (it is pooled)"
