skill: ask-sonner

should_trigger:
  - prompt: "Set up Sonner in this Next.js app."
    why: "Sonner setup: the skill's core use case, and the Toaster-in-layout rule is the first thing it says."
  - prompt: "My toasts appear twice — what did I do wrong?"
    why: "A named symptom with a known cause (a second mounted Toaster)."
  - prompt: "How do I show a loading toast that resolves when the promise finishes?"
    why: "Promise and loading toasts are explicitly in scope."
  - prompt: "My toast is rendering behind the modal."
    why: "One of the named common failures the skill exists to fix."
  - prompt: "The Tailwind classes I pass to my toast are being ignored."
    why: "A named styling failure with a specific answer."
  - prompt: "Make the toasts follow our dark mode."
    why: "Theming is an explicit section."

should_not_trigger:
  - prompt: "What should I use for toasts in this app?"
    route_to: "pick-ui-library"
    why: "The choice between libraries comes first; its answer for toasts is this skill."
  - prompt: "Change the toast's enter animation curve and make the exit faster."
    route_to: "animate"
    why: "Custom motion beyond the library's props."
  - prompt: "Set up the App Router layout and server actions for this page."
    route_to: "nextjs"
    why: "App wiring, not the toast library."
  - prompt: "Our transactional emails land in spam."
    route_to: "email-deliverability"
    why: "Also 'notifications', but a completely different surface."

capability:
  - scenario: "User calls toast() from inside a Next.js server action and nothing appears."
    expect: "Names the actual cause — toast() does nothing on the server — and gives the fix: return the result from the action and call toast() in the client code that receives it. Does not suggest mounting a second Toaster."
